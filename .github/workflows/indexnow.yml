# Meldet neue oder geaenderte News und Guides (deutsch und englisch) per IndexNow, wenn ein Mensch etwas mergt oder selbst committet.
# (Pushes des News-Bots loesen diesen Workflow nicht aus; der Bot pingt selbst.)
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'src/content/news/**'
      - 'src/content/guides/**'
      - 'src/content/en/news/**'
      - 'src/content/en/guides/**'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://palmbandits.com' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Geaenderte Seiten ermitteln und melden
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
          URLS=""
          for f in $(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- src/content/news src/content/guides src/content/en/news src/content/en/guides); do
            case "$f" in
              src/content/en/news/*.md) URLS="$URLS ${SITE_URL%/}/en/news/$(basename "$f" .md)/" ;;
              src/content/en/guides/*.md) URLS="$URLS ${SITE_URL%/}/en/guides/$(basename "$f" .md)/" ;;
              src/content/news/*.md) URLS="$URLS ${SITE_URL%/}/news/$(basename "$f" .md)/" ;;
              src/content/guides/*.md) URLS="$URLS ${SITE_URL%/}/guides/$(basename "$f" .md)/" ;;
            esac
          done
          if [ -z "$URLS" ]; then echo "Keine neuen Seiten."; exit 0; fi
          echo "Melde:$URLS"
          sleep 150
          INDEXNOW_URLS="$URLS" node automation/news-bot/indexnow.mjs
