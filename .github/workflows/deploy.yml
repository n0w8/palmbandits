# Website bauen und per FTPS auf den easyname-Webspace laden (Ordner /palmbandits/, Domain palmbandits.com).
# Laeuft bei Aenderungen an der Seite, nach jedem Lauf von News-Bot und Guide-Radar (deren Commits loesen
# keinen push-Trigger aus) und einmal taeglich (News-Sitemap, Countdown). Laedt nur geaenderte Dateien hoch.
# Nach Bot-Laeufen wird nur gebaut, wenn in den letzten 40 Minuten jemand etwas an der Seite committet hat
# (der News-Bot laeuft alle 15 Minuten, meist ohne neue News). Das Zeitfenster faengt auch einen Deploy auf,
# den GitHub wegen der Warteschlange (concurrency) verworfen hat.
# Braucht: Secret FTP_PASSWORD, Variablen FTP_SERVER und FTP_USERNAME (optional FTP_DIR, FTP_PROTOCOL).
name: Deploy

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'astro.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_run:
    workflows: ['News-Bot', 'Guide-Radar']
    types: [completed]
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Auch nach einem fehlgeschlagenen Bot-Lauf: gruene News koennen schon committet sein (z. B. wenn nur der
    # Pull-Request-Schritt scheitert). Ob es wirklich etwas Neues gibt, prueft der Schritt "Neues fuer die Seite?".
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Zugang vorhanden?
        id: check
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$PW" ] || [ -z "${{ vars.FTP_SERVER }}" ] || [ -z "${{ vars.FTP_USERNAME }}" ]; then
            echo "FTP-Zugang fehlt (Secret FTP_PASSWORD, Variablen FTP_SERVER/FTP_USERNAME), uebersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'
        with:
          ref: main
          fetch-depth: 40
      - name: Neues fuer die Seite?
        id: changes
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RECENT=$(git log -1 --since="40 minutes ago" --format=%h -- src public astro.config.mjs package.json package-lock.json)
          if [ -n "$RECENT" ]; then
            echo "Neue Inhalte (Commit $RECENT), Seite wird gebaut und hochgeladen."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Der Bot-Lauf hat nichts an der Seite geaendert, kein Deploy noetig."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.changes.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Seite bauen
        if: steps.changes.outputs.go == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html && test -f dist/.htaccess
      - name: Per FTPS hochladen (nur Aenderungen)
        if: steps.changes.outputs.go == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || '/palmbandits/' }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
