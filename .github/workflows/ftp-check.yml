# Einmalige Pruefung (22.11.2026): Welche Ordner sieht der FTP-Benutzer aus FTP_USERNAME?
# Der Deploy scheiterte mit "550 _astro: No such file or directory". Nur manuell startbar, aendert nichts.
name: FTP-Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ordner auflisten (nur lesen)
        env:
          H: ${{ vars.FTP_SERVER }}
          U: ${{ vars.FTP_USERNAME }}
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          zeig() {
            echo "=== $1"
            curl -s --ssl-reqd -m 30 --list-only "ftp://$H$1" --user "$U:$PW" | head -40 || echo "(nicht lesbar)"
          }
          echo "=== Startordner nach dem Login:"
          curl -s --ssl-reqd -m 30 -v "ftp://$H/" --user "$U:$PW" -o /dev/null 2>&1 | grep -E '^< 257' || true
          zeig /
          zeig /palmbandits/
          zeig /html/
          zeig /html/palmbandits/
          zeig /nordwald/
          exit 0
